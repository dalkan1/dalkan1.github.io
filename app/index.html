<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dalkan Platea – Demo</title><meta name="theme-color" content="#13233D"><meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-9 -9 54 54'%3E%3Crect x='-9' y='-9' width='54' height='54' rx='11' fill='%2313233D'/%3E%3Cg fill='%23fff'%3E%3Crect width='24' height='7' rx='2.2'/%3E%3Crect width='7' height='24' rx='2.2'/%3E%3Crect x='12' y='29' width='24' height='7' rx='2.2'/%3E%3Crect x='29' y='12' width='7' height='24' rx='2.2'/%3E%3C/g%3E%3Crect x='12' y='29' width='6' height='7' rx='1.6' fill='%23C2410C'/%3E%3Crect x='0' y='18' width='7' height='6' rx='1.6' fill='%23C2410C'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="../img/platea_app_icon_180.png">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(../fonts/barlowcond-500.woff) format("woff")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(../fonts/barlowcond-600.woff) format("woff")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(../fonts/barlowcond-700.woff) format("woff")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(../fonts/plexmono-400.woff) format("woff")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-display:swap;src:url(../fonts/plexmono-600.woff) format("woff")}
@font-face{font-family:"IBM Plex Sans";font-weight:100 700;font-display:swap;src:url(../fonts/plexsans-var.woff) format("woff")}
/* Layout: command rail (wide) / bottom nav (narrow) + one scrolling work column.
   Light = "Saha modu" (sunlight, high contrast), dark = "Gece" (navy). Safety orange is the one accent. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#0D1828; --muted:#4A576C;
  --line:#C9D1DC; --line2:#E1E6ED; --navy:#13233D; --navy-ink:#FFFFFF;
  --accent:#C2410C; --accent-strong:#9A3412; --accent-soft:#FDE8DC; --accent-ink:#FFFFFF;
  --ok:#17784A; --ok-bg:#DDF2E6; --warn:#9A6200; --warn-bg:#FBEFD2; --crit:#B42318; --crit-bg:#FCE4E2;
  --info:#1F5FA6; --info-bg:#DEEAF8; --idle:#5B6678; --idle-bg:#E6EAF0;
  --shadow:0 1px 2px rgba(13,24,40,.06),0 6px 20px rgba(13,24,40,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111D; --surface:#111B2C; --surface2:#16233A; --ink:#E7ECF3; --muted:#9AA8BE;
  --line:#2A3A55; --line2:#1E2B42; --navy:#0E1A2E; --navy-ink:#E7ECF3;
  --accent:#FF7A1F; --accent-strong:#FF9447; --accent-soft:#3A2414; --accent-ink:#1A0E05;
  --ok:#43C07F; --ok-bg:#12301F; --warn:#F0B64C; --warn-bg:#33270E; --crit:#FF6B5E; --crit-bg:#3A1714;
  --info:#73AEF2; --info-bg:#132A45; --idle:#9AA8BE; --idle-bg:#1B2840;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A111D; --surface:#111B2C; --surface2:#16233A; --ink:#E7ECF3; --muted:#9AA8BE;
  --line:#2A3A55; --line2:#1E2B42; --navy:#0E1A2E; --navy-ink:#E7ECF3;
  --accent:#FF7A1F; --accent-strong:#FF9447; --accent-soft:#3A2414; --accent-ink:#1A0E05;
  --ok:#43C07F; --ok-bg:#12301F; --warn:#F0B64C; --warn-bg:#33270E; --crit:#FF6B5E; --crit-bg:#3A1714;
  --info:#73AEF2; --info-bg:#132A45; --idle:#9AA8BE; --idle-bg:#1B2840;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.12rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:.8rem;color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);
  display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.wordmark{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;font-size:1.05rem;line-height:1;white-space:nowrap}
.wordmark small{display:block;font-weight:500;letter-spacing:.24em;font-size:.62rem;opacity:.7;margin-top:3px}
.topbar .spacer{flex:1}
.projsel{display:flex;align-items:center;gap:8px;min-width:0}
.projsel select{background:transparent;border:1px solid rgba(255,255,255,.28);color:var(--navy-ink);border-radius:8px;padding:6px 8px;max-width:46vw;min-height:38px}
.projsel select option{color:#0D1828}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;opacity:.85;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.local i{background:var(--warn)} .sync.wait i{background:var(--idle)}

.rail{display:none}
.main{padding-inline:16px;padding-block:18px 110px;max-width:1080px;width:100%;margin:0 auto;min-width:0}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;cursor:pointer;
  color:var(--muted);padding:8px 2px;min-height:58px;font-size:.72rem;font-weight:500}
.navbtn svg{width:22px;height:22px}
.navbtn[aria-current="page"]{color:var(--accent)}
.navbtn .dot{position:absolute}
@media (min-width:900px){
  .shell{grid-template-columns:232px 1fr}
  .topbar{grid-column:1 / -1}
  .rail{display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-right:1px solid var(--line);background:var(--surface);
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);height:calc(100vh - 61px);overflow:auto}
  .rail .navbtn{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:8px;font-size:.95rem;min-height:46px}
  .rail .navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
  .rail .sep{height:1px;background:var(--line2);margin:8px 6px}
  .bottomnav{display:none}
  .main{padding-block:26px 48px;padding-inline:28px}
}

/* ---------- common blocks ---------- */
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.pagehead p{margin-top:4px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem}
.btn svg{width:18px;height:18px}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.idle{background:var(--idle-bg);color:var(--idle)} .pill.acc{background:var(--accent-soft);color:var(--accent-strong)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;background:var(--info-bg);color:var(--ink);border:1px solid var(--line2);font-size:.9rem}
.banner.warn{background:var(--warn-bg)} .banner.acc{background:var(--accent-soft)}
.banner b{font-weight:600}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.82rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 12px}
textarea.input{min-height:92px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.fgrid.c2{grid-template-columns:1fr 1fr}.fgrid.c3{grid-template-columns:1fr 1fr 1fr}}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* ---------- lagebild ---------- */
.hero{border:1px solid var(--line);background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:18px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero .code{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em;opacity:.8}
.hero h1{font-size:2rem;margin-top:2px}
.hero .addr{opacity:.8;font-size:.92rem;margin-top:4px}
.hero .badges{display:flex;flex-wrap:wrap;gap:8px}
.hero .pill{background:rgba(255,255,255,.1);color:var(--navy-ink);border-color:rgba(255,255,255,.18)}
.hero .grid-bg{position:absolute;inset:0;pointer-events:none;opacity:.08;
  background-image:linear-gradient(rgba(255,255,255,1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,1) 1px,transparent 1px);background-size:28px 28px}
.bauzeit{display:grid;gap:6px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ladder .step{height:30px;border-radius:5px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem}
.ladder .step.done{background:rgba(255,255,255,.28)}
.ladder .step.cur{background:var(--accent);color:var(--accent-ink);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.kpi .n{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1}
.kpi .n.crit{color:var(--crit)} .kpi .n.warn{color:var(--warn)} .kpi .n.ok{color:var(--ok)}
.quick{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.quick{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.quick .btn{min-height:56px;justify-content:flex-start;padding:0 16px}
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.alert:last-child{border-bottom:0}
.alert .sev{width:4px;align-self:stretch;border-radius:2px;background:var(--warn);flex:none}
.alert .sev.crit{background:var(--crit)}
.alert .txt{flex:1;min-width:0}

/* ---------- list cards (quest log) ---------- */
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:5px 1fr;overflow:hidden;cursor:pointer;text-align:left;width:100%}
.qcard .stripe{background:var(--idle)}
.qcard .stripe.crit{background:var(--crit)} .qcard .stripe.warn{background:var(--warn)} .qcard .stripe.ok{background:var(--ok)}
.qcard .stripe.info{background:var(--info)} .qcard .stripe.acc{background:var(--accent)}
.qbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qid{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.qtitle{font-weight:600;font-size:1rem}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}

/* diary */
.daycard .date{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.wx{display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.crewrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.crewrow:last-child{border-bottom:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:var(--surface2);cursor:pointer;font-size:1.2rem;font-weight:600}
.stepper output{min-width:42px;text-align:center;font-family:var(--f-mono);font-weight:600}

/* docs */
.doccat{margin-top:6px}
.docrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.docrow:last-child{border-bottom:0}
.docrow .t{font-weight:600}
.docrow .req{font-size:.72rem;font-weight:700;color:var(--accent-strong);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}

/* table (wissen) */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.de{font-weight:600}
tr:last-child td{border-bottom:0}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50}
.sheet-scrim{position:absolute;inset:0;background:rgba(5,10,18,.5)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (min-width:900px){.sheet-panel{left:auto;top:0;bottom:0;width:min(620px,92vw);max-height:none;border-radius:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:16px 16px 0 0;padding-top:max(14px,env(safe-area-inset-top,0px))}
@media (min-width:900px){.sheet-head{border-radius:0}}
.sheet-head h2{flex:1;font-size:1.3rem}
.sheet-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>.label{border-bottom:1px solid var(--line2);padding-bottom:6px}
.statusflow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.statusflow button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:52px;cursor:pointer;font-size:.82rem;font-weight:600;padding:4px}
.statusflow button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.statusflow small{display:block;font-weight:400;font-family:var(--f-mono);font-size:.7rem;opacity:.8}
.photostrip{display:flex;gap:8px;flex-wrap:wrap}
.photostrip .ph{position:relative}
.photostrip img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.photostrip .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--crit-bg);border-radius:9px;padding:10px 12px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:500;font-size:.9rem;max-width:min(92vw,520px);box-shadow:var(--shadow)}
@media (min-width:900px){#toast{bottom:24px}}
.boot{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted);gap:10px}
pre.pack{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:12px;font-family:var(--f-mono);font-size:.78rem;max-height:320px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){.wordmark small{display:none}.sync span{display:none}.wordmark{font-size:.95rem;letter-spacing:.12em}.hero h1{font-size:1.6rem}}

/* ---------- v1.1: AI, plans, viewer, chat, meetings ---------- */
.aichip{border:1px dashed var(--accent);color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;cursor:pointer;min-height:30px;white-space:nowrap}
.aichip:disabled{opacity:.6}
.plangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.plancard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-width:0}
.plancard:hover{border-color:var(--accent)}
.pc-ic{width:34px;height:34px;color:var(--accent);display:inline-flex}
.pc-t{font-weight:600;font-size:1rem}

function loadImgEl(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function compress(file,max,q){const u=URL.createObjectURL(file);try{const img=await loadImgEl(u);const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q)),url:c.toDataURL('image/jpeg',q)}}finally{URL.revokeObjectURL(u)}}
async function addPhotos(files,key='photos'){
  if(!S.draft)return;S.draft[key]=S.draft[key]||[];const st=$('#pstat-'+key);
  for(const f of files){try{if(st)st.textContent=t('uploading');
    if(assets){const {blob}=await compress(f,1600,.82);const r=await assets.upload(blob,{type:'image/jpeg'});S.draft[key].push({a:r.id})}
    else{const {url}=await compress(f,900,.6);S.draft[key].push({d:url})}
    const s=$('#pstrip-'+key);if(s)s.innerHTML=stripHTML(key)}catch(e){toast(t('err_upload',(e&&(e.code||e.message))||'?'))}}
  if(st)st.textContent='';
}

    if(isImgV(v)){const img=await loadImgEl('files/'+v.a);const sc=Math.min(1,1800/img.naturalWidth);c.width=img.naturalWidth*sc;c.height=img.naturalHeight*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height)}
    else{const pdf=await openPdf(v.a),page=await pdf.getPage(d.pin.page||1),vp1=page.getViewport({scale:1}),vp=page.getViewport({scale:1800/vp1.width});c.width=vp.width;c.height=vp.height;
      const g0=c.getContext('2d');g0.fillStyle='#fff';g0.fillRect(0,0,c.width,c.height);await page.render({canvasContext:g0,viewport:vp}).promise}
    const cw=Math.round(c.width*.34),ch=Math.round(cw*.75);let x=Math.round(d.pin.x*c.width-cw/2),y=Math.round(d.pin.y*c.height-ch/2);x=Math.max(0,Math.min(c.width-cw,x));y=Math.max(0,Math.min(c.height-ch,y));
    const o=document.createElement('canvas');o.width=cw;o.height=ch;const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.drawImage(c,x,y,cw,ch,0,0,cw,ch);
    const px=d.pin.x*c.width-x,py=d.pin.y*c.height-y;g.strokeStyle='#C2410C';g.lineWidth=Math.max(3,cw/110);g.beginPath();g.arc(px,py,cw/20,0,Math.PI*2);g.stroke();
    g.fillStyle='#C2410C';g.font=`bold ${Math.round(cw/22)}px Helvetica, Arial, sans-serif`;g.fillText(mno(d.no),Math.min(px+cw/16,cw-cw/5),Math.max(py-cw/26,cw/20));
    g.strokeStyle='#888';g.lineWidth=1;g.strokeRect(.5,.5,cw-1,ch-1);
    return cropCache[key]={u:o.toDataURL('image/jpeg',.85),r:cw/ch,title:doc.title}}catch(e){return null}}
async function pdfText(docId,max){const d=S.docs[docId];if(!d)throw new Error('unknown doc_id');const v=planVer(d);if(!v)throw new Error('no file attached to this document');
  if(isImgV(v))return 'This document is an image (plan drawing), no text layer. Title: '+d.title;
  const pdf=await openPdf(v.a);let out='';for(let i=1;i<=Math.min(pdf.numPages,30)&&out.length<max;i++){const tc=await(await pdf.getPage(i)).getTextContent();out+=`\n--- Seite ${i} ---\n`+tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ')}
  return `${d.title} (Version ${v.v}, ${pdf.numPages} Seiten)\n`+out.slice(0,max)}

- Base answers on the project data below; say clearly when something is not in the data instead of guessing.${tools?' Use get_diary for older diary entries and read_document to read attached PDFs (permit, plans, contracts) before answering questions about their content.':''}
- Legal and normative points: name the source (e.g. VOB/B § 4 Abs. 7, BGB § 650b, BaustellV § 2). If you are unsure about a detail or the current version of a rule, say so and recommend checking it. You give practical guidance, not binding legal advice.

${buildContext()}`}

async function asSend(text){const A=S.ui.as;if(A.busy)return;text=String(text??(($('#as-in')||{}).value||'')).trim();if(!text)return;S.ui.asText='';
  const msgs=chatMsgs().slice();msgs.push({r:'u',t:text,ts:Date.now()});await saveChat(msgs);
  const useTools=!!(sampleCaps&&sampleCaps.tools);A.busy=true;A.live='';A.status='';A.ctl=new AbortController();scheduleRender();scrollChat();
  const hist=msgs.slice(-16);while(hist.length&&hist[0].r!=='u')hist.shift();
  const turns=[{role:'user',content:assistRules(useTools)},...hist.map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}))];
  const opts={signal:A.ctl.signal,onText:({text})=>{A.live=text;const el=$('#aslive');if(el)el.innerHTML=mdLite(text);scrollChat()}};
  if(useTools)opts.tools=assistTools();else opts.cache=false;if(A.img&&sampleCaps&&sampleCaps.images)opts.images=[A.img];
  try{const r=await sampleFn(turns,opts);msgs.push({r:'a',t:r.text+(r.truncated?'\n\n…':''),ts:Date.now()})}
  catch(e){if(e&&e.text)msgs.push({r:'a',t:e.text+'\n\n…',ts:Date.now()});if(!e||e.code!=='cancelled')toast(aiErr(e))}

  arr('daywork').filter(w=>!w.signed&&w.submittedAt).forEach(w=>{const dl=addWerktage(w.submittedAt,6);A.push({sev:dl<=addDays(td,1)?'crit':'warn',txt:t('a_dw',`${firmName(w.firm)} ${fd(w.date)}`,fd(dl)),act:`data-act="openDaywork" data-id="${w.id}"`})});

  tAlerts().forEach(x=>A.push(x));kAlerts().forEach(x=>A.push(x));
  return A}

/* ---------- Nachfrist ---------- */
function noticeContent2(p,f,l,vob,before,after){
  const firstDates=[...new Set(l.map(d=>d.notifiedAt).filter(Boolean))].sort().map(x=>fdDE(x)),prevDue=[...new Set(l.map(d=>d.due).filter(Boolean))].sort().map(x=>fdDE(x));
  const subject=`Mängelbeseitigung – Nachfristsetzung – BV ${p.name}, ${p.address||''}`;
  const intro=`mit unserem Schreiben vom ${firstDates.join(', ')||'…'} haben wir Sie aufgefordert, die nachstehend aufgeführten Mängel bis zum ${prevDue.join(', ')||'…'} zu beseitigen. Diese Frist ist fruchtlos verstrichen; eine Fertigstellungsanzeige liegt uns nicht vor.`;
  const demand=`Wir setzen Ihnen hiermit eine letzte Nachfrist zur fachgerechten Beseitigung der Mängel bis spätestens ${fdDE(S.ui.nfrist)}.`;
  const rights=vob?(after?'Nach fruchtlosem Ablauf dieser Nachfrist werden wir die Mängel auf Ihre Kosten beseitigen lassen (§ 13 Abs. 5 Nr. 2 VOB/B) und behalten uns alle weiteren Rechte vor.':'Nach fruchtlosem Ablauf dieser Nachfrist behalten wir uns sämtliche Rechte aus § 4 Abs. 7 VOB/B vor.'):'Nach fruchtlosem Ablauf dieser Nachfrist behalten wir uns sämtliche gesetzlichen Rechte, insbesondere aus §§ 634 ff. BGB, vor.';
  const sign=[S.settings.userName||'',p.role==='AN'?`Bauleitung${S.settings.company?' · '+S.settings.company:''}`:`Objektüberwachung im Auftrag des Bauherrn${p.client?' ('+p.client+')':''}${S.settings.company?' · '+S.settings.company:''}`];
  return {p,f,l,subject,intro,demand,rights,sign}}

   Reads IFC2x3 / IFC4 STEP files: spatial structure, element hierarchy, layers, colours and
   body geometry (tessellated face sets, B-reps, surface models, extrusions, mapped items, clipping = first operand). */
function stepStr(s){if(s.indexOf('\\')<0)return s;
  return s.replace(/\\X2\\([0-9A-Fa-f]+)\\X0\\/g,(m,h)=>{let o='';for(let k=0;k+4<=h.length;k+=4)o+=String.fromCharCode(parseInt(h.substr(k,4),16));return o})
    .replace(/\\X\\([0-9A-Fa-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\S\\(.)/g,(m,c)=>String.fromCharCode(c.charCodeAt(0)+128)).replace(/\\\\/g,'\\')}
function stepSplit(txt){const E=new Map();let i=txt.indexOf('DATA;');if(i<0)throw new Error('DATA section missing');i+=5;
  const n=txt.length;let st=i,inS=false;const re=/^\s*#(\d+)\s*=\s*([A-Za-z0-9_]+)\s*\(([\s\S]*)\)\s*$/;
  for(;i<n;i++){const c=txt.charCodeAt(i);if(c===39){inS=!inS;continue}if(inS||c!==59)continue;
    const s=txt.slice(st,i);st=i+1;const m=re.exec(s);
    if(m)E.set(+m[1],{t:m[2].toUpperCase(),s:m[3],a:null});else if(/^\s*ENDSEC\s*$/.test(s))break}
  return E}

  const sk=()=>{while(i<n&&s.charCodeAt(i)<=32)i++};
  function val(){sk();const c=s.charCodeAt(i);
    if(c===39){let o='',a=++i;for(;;){const q=s.indexOf("'",i);if(q<0){i=n;break}if(s.charCodeAt(q+1)===39){i=q+2;continue}o=s.slice(a,q);i=q+1;break}return stepStr(o.replace(/''/g,"'"))}
    if(c===35){const a=++i;while(i<n){const d=s.charCodeAt(i);if(d<48||d>57)break;i++}return {r:+s.slice(a,i)}}
    if(c===40){i++;const L=[];sk();if(s.charCodeAt(i)===41){i++;return L}for(;;){L.push(val());sk();const d=s.charCodeAt(i);if(d===44){i++;continue}if(d===41)i++;break}return L}

  const out=[];sk();if(i>=n)return out;for(;;){out.push(val());sk();if(s.charCodeAt(i)===44){i++;continue}break}return out}

  const ax=Math.abs(nx),ay=Math.abs(ny),az=Math.abs(nz);const pr=az>=ax&&az>=ay?p=>new T.Vector2(p[0],p[1]):ax>=ay?p=>new T.Vector2(p[1],p[2]):p=>new T.Vector2(p[2],p[0]);

/* ===================== 3.0 Terminplan (Soll / Ist) ===================== */
const tSched=()=>arr('sched').sort((a,b)=>String(a.start).localeCompare(String(b.start))||(a.order||0)-(b.order||0)||String(a.title).localeCompare(String(b.title)));
const tDur=x=>x.ms?0:Math.max(1,diff(x.start,x.end)+1);
function tSoll(x,d){if(!x.start)return 0;if(x.ms)return d>=x.start?100:0;if(d<x.start)return 0;if(d>=x.end)return 100;return Math.round((diff(x.start,d)+1)/tDur(x)*1000)/10}
function bimCredit(st,d){if(!st)return 0;let s=null;for(const h of (st.h||[]))if(h.d<=d)s=Number(h.s);if(s==null&&!(st.h||[]).length&&st.d&&st.d<=d)s=Number(st.s);return s>=2?1:s===1?.5:0}
function tLinkedEls(x){const m=bimCur();if(!m||!(x.bim||[]).length)return [];const L=x.bim.map(k=>k.split('|'));return bimEls(m).filter(e=>e.cat!=='context'&&L.some(([z,c])=>e.zone===z&&e.cat===c))}
function tIst(x,d){d=d||today();if(x.ms)return x.done&&(!x.doneAt||x.doneAt<=d)?100:0;const E=tLinkedEls(x);
  if(E.length)return Math.round(E.reduce((a,e)=>a+bimCredit(e.st,d),0)/E.length*1000)/10;
  let p=0;for(const h of (x.ph||[]))if(h.d<=d)p=Number(h.p)||0;return p}
function tState(x){const td=today(),so=tSoll(x,td),is=tIst(x,td);
  if(x.ms)return {so,is,k:is>=100?'ok':x.start<td?'crit':'idle'};
  if(is>=100)return {so,is,k:'ok'};if(x.end<td)return {so,is,k:'crit',late:true};
  if(x.start<addDays(td,-2)&&is===0)return {so,is,k:'warn',ns:true};const dv=is-so;return {so,is,k:dv<-20?'crit':dv<-8?'warn':x.start>td?'idle':'ok'}}
function tForecast(x){if(x.ms)return x.start;const td=today(),is=tIst(x,td);if(is>=100||!x.start)return '';if(x.start>td)return x.end;
  const rest=addDays(td,Math.max(0,Math.ceil((100-is)/100*tDur(x))-1));return rest>x.end?rest:x.end}
function tTotal(d){const L=tSched().filter(x=>!x.ms&&x.start&&x.end);const W=L.reduce((a,x)=>a+tDur(x),0);if(!W)return {so:0,is:0};
  return {so:Math.round(L.reduce((a,x)=>a+tDur(x)*tSoll(x,d),0)/W*10)/10,is:Math.round(L.reduce((a,x)=>a+tDur(x)*tIst(x,d),0)/W*10)/10}}
function tHindDays(){return Object.keys(S.diary).filter(d=>{const e=S.diary[d];return e&&e.hindrance&&String(e.hindrance).trim()&&e.hindrance!=='—'}).sort()}

function ganttHTML(L,p){const td=today();const s0=[p.start,...L.map(x=>x.start),...L.map(x=>x.bStart)].filter(Boolean).sort()[0],e0=[p.end,...L.map(x=>x.end),...L.map(x=>x.bEnd),...L.map(x=>tForecast(x))].filter(Boolean).sort().pop();

  const hd=tHindDays();const tdx=X(td);
  const rows=L.map(x=>{const s=tState(x),is=s.is,fc=tForecast(x);const firm=x.firm?firmName(x.firm):'';
    let bar='';if(x.ms){bar=`<div class="gmsk ${s.k}" style="left:${X(x.start)-8}px" title="${esc(fd(x.start))}"></div>`}
    else{const l=X(x.start),w=Math.max(4,X(addDays(x.end,1))-l);bar=`<div class="gbar ${s.k}" style="left:${l}px;width:${w}px"><i style="width:${Math.min(100,is)}%"></i></div>`;

function tCurveHTML(p){if(!p.start||!p.end)return '<p class="muted">—</p>';const td=today(),s=p.start,e=[p.end,...tSched().map(x=>x.end)].sort().pop(),span=Math.max(1,diff(s,e));

const kContracts=()=>arr('contracts').sort((a,b)=>firmName(a.firm).localeCompare(firmName(b.firm)));
const kInvs=c=>arr('invoices').filter(i=>i.contract===c.id).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.no).localeCompare(String(b.no)));
const nz=v=>Number(v)||0;
function kNT(c){const cl=arr('claims').filter(x=>x.firm===c.firm);return {appr:cl.filter(x=>x.status==='approved'||x.status==='billed').reduce((a,x)=>a+nz(x.approvedAmt),0),
  pend:cl.filter(x=>['announced','offered','review'].includes(x.status)).reduce((a,x)=>a+nz(x.checkedAmt!==''&&x.checkedAmt!=null?x.checkedAmt:x.offerAmt),0)}}
function kProgress(c){const L=tSched().filter(x=>x.firm===c.firm&&!x.ms);if(!L.length)return null;let n=0,s=0;
  for(const x of L){const E=tLinkedEls(x);if(E.length){n+=E.length;s+=E.reduce((a,e)=>a+bimCredit(e.st,today()),0)}else{const w=tDur(x)/7;n+=w;s+=w*tIst(x)/100}}return n?Math.round(s/n*1000)/10:null}
function kCalc(c){const I=kInvs(c),N=kNT(c),cur=nz(c.amount)+N.appr,fc=cur+N.pend;const chk=I.reduce((a,i)=>Math.max(a,nz(i.chkCum)),0),req=I.reduce((a,i)=>Math.max(a,nz(i.reqCum)),0),paid=I.reduce((a,i)=>a+nz(i.paid),0);
  const prog=kProgress(c);const billedPct=cur?Math.round(Math.max(chk,req)/cur*1000)/10:0;return {I,N,cur,fc,chk,req,paid,prog,billedPct,dev:fc-nz(c.budget)}}
function kDue(i){const p=P();const days=i.kind==='SR'?30:(p&&p.basis==='BGB'?30:21);return i.date?addDays(i.date,days):''}
function kPayable(c,i){const I=kInvs(c);const prev=I.filter(x=>x!==i&&(String(x.date)<String(i.date)||(x.date===i.date&&String(x.no)<String(i.no)))).reduce((a,x)=>a+nz(x.paid),0);
  const se=i.kind==='SR'?nz(c.se):nz(c.se);return i.chkCum===''||i.chkCum==null?null:Math.round((nz(i.chkCum)*(1-se/100)-prev)*100)/100}
function kState(i){return nz(i.paid)>0||i.paidAt?'paid':(i.chkCum!==''&&i.chkCum!=null?'checked':'open')}
function kAlerts(){const A=[],td=today();
  kContracts().forEach(c=>{const K=kCalc(c),nm=firmName(c.firm),act=`data-act="kOpenC" data-id="${esc(c.id)}"`;
    K.I.filter(i=>kState(i)!=='paid').forEach(i=>{const due=kDue(i);if(!due)return;const n=diff(td,due);const a=`data-act="kOpenI" data-id="${esc(i.id)}"`;
      if(n<0)A.push({sev:'crit',txt:t('a_k_late',`${nm} ${i.no}`),act:a});else if(n<=7)A.push({sev:n<=2?'crit':'warn',txt:t('a_k_due',`${nm} ${i.no} (${fd(due)})`,n),act:a})});
    if(nz(c.budget)&&K.fc>nz(c.budget))A.push({sev:'warn',txt:t('a_k_budget',nm,'+'+eur(K.fc-nz(c.budget))),act});
    if(K.prog!=null&&K.billedPct>K.prog+10)A.push({sev:'warn',txt:t('a_k_over',nm,Math.round(K.billedPct),Math.round(K.prog)),act})});return A}

    const I=arr('invoices').sort((a,b)=>String(a.date).localeCompare(String(b.date)));

      I.map(i=>{const c=S.contracts[i.contract]||{};const pay=c.id?kPayable(c,i):null;const st=kState(i);return [firmName(c.firm),`${i.no} (${i.kind==='SR'?'Schluss':'Abschlag'})`,fdDE(i.date),fdDE(kDue(i)),E(i.reqCum),E(i.chkCum),pay==null?'–':E(pay),st==='paid'?'bezahlt '+fdDE(i.paidAt):st==='checked'?'geprüft':'offen']}))}
    const A=kAlerts();if(A.length){r.lbl('Hinweise');A.forEach(a=>r.para('• '+a.txt,{size:8.6,gap:.6}))}
    r.para('Leistungsstand je Firma aus dem Terminplan (BIM-verknüpfte Vorgänge: Bauteilstatus, sonst manueller Ist-Wert). Auszahlung = geprüft kumuliert × (1 − Sicherheitseinbehalt) − bisherige Zahlungen. Prüffristen nach VOB/B § 16 (Abschlag 21 Tage, Schlussrechnung 30 Tage).',{size:7.6});
    await saveFile(fileSafe(`Kostenuebersicht_${p.code}_${today()}.pdf`),r.finish(p.code))}catch(e){toast(t('pdf_fail',e.message))}}
function kContext(){const C=kContracts();if(!C.length)return '';const L=['','## Kosten (netto)'];
  C.forEach(c=>{const K=kCalc(c);L.push(`- ${firmName(c.firm)} ${c.title||''}: Budget ${eur(c.budget,'de')}, Auftrag ${eur(c.amount,'de')}, NT beauftragt ${eur(K.N.appr,'de')}, NT offen ${eur(K.N.pend,'de')}, Prognose ${eur(K.fc,'de')}, geprüft kum. ${eur(K.chk,'de')}, bezahlt ${eur(K.paid,'de')}, abgerechnet ${Math.round(K.billedPct)} % vs. Leistungsstand ${K.prog==null?'–':Math.round(K.prog)+' %'}`);
    K.I.forEach(i=>L.push(`  - ${i.no}: Eingang ${fd(i.date,'de')}, angefordert kum. ${eur(i.reqCum,'de')}, geprüft kum. ${eur(i.chkCum,'de')}, bezahlt ${eur(i.paid,'de')}${i.paidAt?' am '+fd(i.paidAt,'de'):''}, Frist ${fd(kDue(i),'de')}`))});return L.join('\n')}
Object.assign(ACT,{kOpenC:el=>kOpenC(el.dataset.id),kSaveC:kSaveC,kOpenI:el=>kOpenI(el.dataset.id,el.dataset.c),kSaveI:kSaveI,pdfKosten:pdfKosten});
document.addEventListener('change',e=>{const el=e.target;
  if((el.id==='ki-c'||el.id==='ki-kind'||el.id==='ki-date'||el.id==='ki-chk')&&S.draft&&S.draft.contract!==undefined){kReadI();kInvSheet(!!S.invoices[S.draft.id]);return}
  if(el.dataset&&el.dataset.invfile&&el.files&&el.files[0]){const f=el.files[0];el.value='';toast(t('uploading'));
    assets.upload(f,f.type?undefined:{type:'application/pdf'}).then(r=>{S.draft.files.push({a:r.id,name:f.name});$('#kifiles').innerHTML=S.draft.files.map(x=>`<div><a href="files/${esc(x.a)}" target="_blank" rel="noopener">${esc(x.name)}</a></div>`).join('')}).catch(x=>toast(t('err_upload',x.code||x.message)))}});

boot();

</script></body></html>
